# G7 — Improvement Loop Triggers (Step D)
# Event bindings for autonomous detection
# Status: DRAFT_PRE_GATE
# Upstream: vibecoding-v1.0.0 (G6 LOCKED)
# BLUE resume: G7_IMPROVEMENT_BOUNDS_v1

version: "1.0.0-draft"
domain: G7
kind: improvement_triggers
status: DRAFT_PRE_GATE
overlay: OPTION_2_STANDARD
upstream_tag: vibecoding-v1.0.0
blue_resume_token: G7_IMPROVEMENT_BOUNDS_v1

# ---------------------------------------------------------------------------
# 1. G5 Trajectory-Based Triggers
# ---------------------------------------------------------------------------
trajectory_triggers:
  - id: TRJ-01
    name: trajectory_verdict_fail
    source: "G5 trajectory record verdict field"
    condition: "verdict == fail"
    severity: S3
    improvement_type: IT-01
    operator: DRAFT
    cooldown_cycles: 2
    description: "Agent cycle ended in failure verdict"

  - id: TRJ-02
    name: trajectory_verdict_escalate_hitl
    source: "G5 trajectory record verdict field"
    condition: "verdict == escalate_HITL"
    severity: S2
    improvement_type: IT-04
    operator: DRAFT
    cooldown_cycles: 3
    description: "Agent cycle escalated to HITL"

  - id: TRJ-03
    name: repeated_tool_call_errors
    source: "Trajectory action/observation fields"
    condition: "same_tool_error_count >= 3 within sliding_window_10"
    severity: S3
    improvement_type: IT-01
    operator: DRAFT
    cooldown_cycles: 3
    description: "Same tool failing repeatedly — prompt or skill gap"

  - id: TRJ-04
    name: flat_fix_curve
    source: "C-LOOP-02 fix attempt tracking"
    condition: "fix_attempts >= 3 without resolution"
    severity: S2
    improvement_type: IT-03
    operator: PIVOT
    cooldown_cycles: 5
    description: "Fix curve is flat — current approach not converging"

# ---------------------------------------------------------------------------
# 2. G5 Trust Score Triggers
# ---------------------------------------------------------------------------
trust_score_triggers:
