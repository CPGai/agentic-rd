# ---------------------------------------------------------------------------
# 5. Pattern-Based Triggers
# ---------------------------------------------------------------------------
pattern_triggers:
  - id: PAT-01
    name: thrashing_detection
    source: "Improvement loop monitor"
    condition: "same_signal_improved >= 3 OR oscillation_pattern_detected"
    severity: S2
    improvement_type: IT-04
    operator: PIVOT
    cooldown_cycles: 5
    description: "Thrashing — freeze auto-integration"

  - id: PAT-02
    name: regression_after_integration
    source: "Post-integration monitor"
    condition: "new_degradation_within_5_cycles == true"
    severity: S2
    improvement_type: IT-04
    operator: REFINE
    cooldown_cycles: 3
    description: "Improvement caused regression — rollback"

  - id: PAT-03
    name: loop_budget_exceeded
    source: "Loop counter"
    condition: "total_proposals > 10"
    severity: S2
    improvement_type: IT-04
    operator: DRAFT
    cooldown_cycles: 0  # pause loop
    description: "Loop budget exceeded — HITL to continue"

  - id: PAT-04
    name: s4_trend_persistence
    source: "S4 monitor"
    condition: "s4_signal_persists >= 3 cycles"
    severity: S3
    improvement_type: IT-01
    operator: DRAFT
    cooldown_cycles: 2
    description: "S4 signal escalated to S3 due to persistence"

# ---------------------------------------------------------------------------
# 6. Human Feedback Triggers
# ---------------------------------------------------------------------------
human_triggers:
  - id: HUM-01
    name: explicit_steer
    source: "/steer command or review UI"
    condition: "human_feedback_received == true"
    severity: S2
    improvement_type: IT-01
    operator: DRAFT
    cooldown_cycles: 0
    description: "Human provided explicit steering feedback"

  - id: HUM-02
    name: hitl_reviewer_suggestion
    source: "HITL review queue"
    condition: "reviewer_suggests_different_direction == true"
    severity: S2
    improvement_type: IT-04
    operator: PIVOT
    cooldown_cycles: 0
    description: "HITL reviewer suggests pivoting direction"

# ---------------------------------------------------------------------------
# 7. Trigger Cooldown & Dedup Rules
# ---------------------------------------------------------------------------
cooldown_rules:
  global_cooldown_cycles: 2  # minimum cycles between same-trigger firings
  dedup_window: 5  # same trigger+condition within 5 cycles = suppress
  escalation_override: true  # S1 triggers bypass cooldown
  budget_pause: true  # PAT-03 pauses all triggers until HITL resumes

# ---------------------------------------------------------------------------
# 8. Trigger → Severity Escalation
# ---------------------------------------------------------------------------
escalation_rules:
  repeat_escalation: "same_trigger_fired >= 3 within 10 cycles → severity +1"
  cross_trigger_escalation: "2+ triggers fire simultaneously for same root cause → severity +1"
  s1_immediate: "S1 triggers bypass all cooldowns and dedup"
