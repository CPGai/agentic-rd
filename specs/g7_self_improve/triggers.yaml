  - id: EVAL-05
    name: degradation_5pct
    source: "G5 5% threshold"
    condition: "task_success_rate_drop >= 5%"
    severity: S3
    improvement_type: IT-01
    operator: DRAFT
    cooldown_cycles: 2
    description: "5% degradation — auto-flag"

  - id: EVAL-06
    name: degradation_15pct
    source: "G5 15% threshold"
    condition: "task_success_rate_drop >= 15%"
    severity: S2
    improvement_type: IT-04
    operator: DRAFT
    cooldown_cycles: 3
    description: "15% degradation — HITL review required"

  - id: EVAL-07
    name: red_team_bypass
    source: "G5 Red Team injection suite"
    condition: "red_team_bypass == true"
    severity: S1
    improvement_type: IT-07
    operator: DRAFT
    cooldown_cycles: 0
    description: "Red Team found a bypass — security critical"

