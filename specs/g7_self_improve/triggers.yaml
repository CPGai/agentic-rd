    severity: S1
    improvement_type: IT-07
    operator: DRAFT
    cooldown_cycles: 0
    description: "PII detected — immediate trip"

  - id: TS-06
    name: immediate_trip_budget
    source: "G5 PEN-08 (CRITICAL)"
    condition: "budget_ceiling_breach == true"
    severity: S1
    improvement_type: IT-07
    operator: DRAFT
    cooldown_cycles: 0
    description: "Budget ceiling breached — immediate trip"

# ---------------------------------------------------------------------------
# 3. G5 Evaluation Triggers
# ---------------------------------------------------------------------------
evaluation_triggers:
  - id: EVAL-01
    name: llm_judge_score_below_threshold
    source: "G5 LLM-as-Judge rubric"
    condition: "judge_score < 3 on any dimension (1-5 scale)"
    severity: S2
    improvement_type: IT-01
    operator: DRAFT
    cooldown_cycles: 3
    description: "LLM-as-Judge scored below acceptable threshold"

  - id: EVAL-02
    name: hallucination_detected
    source: "G5 LLM-as-Judge hallucination dimension"
    condition: "hallucination == true"
    severity: S2
    improvement_type: IT-01
    operator: DRAFT
    cooldown_cycles: 2
    description: "Hallucination detected in agent output"

  - id: EVAL-03
    name: intent_drift_signal
    source: "G5 Agent-as-Judge AgBOM comparison"
    condition: "agbom_drift == true OR intent_drift == true"
    severity: S2
    improvement_type: IT-04
    operator: DRAFT
    cooldown_cycles: 3
    description: "Agent sub-goals diverging from original mission"

  - id: EVAL-04
    name: trajectory_adherence_drop
    source: "G5 Agent-as-Judge trajectory rubric"
    condition: "adherence_score < 3 (1-5 scale)"
    severity: S3
    improvement_type: IT-01
    operator: DRAFT
    cooldown_cycles: 3
