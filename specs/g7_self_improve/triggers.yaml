    name: trust_score_warning
    source: "G5 CIRCUIT_BREAKER_RULES.yaml threshold"
    condition: "trust_score < 0.85"
    severity: S3
    improvement_type: IT-01
    operator: DRAFT
    cooldown_cycles: 2
    description: "5% degradation from initial trust"

  - id: TS-02
    name: trust_score_hitl_review
    source: "G5 CIRCUIT_BREAKER_RULES.yaml threshold"
    condition: "trust_score < 0.70"
    severity: S2
    improvement_type: IT-04
    operator: DRAFT
    cooldown_cycles: 3
    description: "15% degradation — HITL review required"

  - id: TS-03
    name: trust_score_tripped
    source: "G5 CIRCUIT_BREAKER_RULES.yaml threshold"
    condition: "trust_score < 0.50"
    severity: S1
    improvement_type: IT-07
