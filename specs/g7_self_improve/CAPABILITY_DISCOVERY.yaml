# ---------------------------------------------------------------------------
# 2. Self-Improvement Relevant Skills (T1 — Already Available)
# ---------------------------------------------------------------------------
self_improvement_skills:
  - name: systematic-debugging
    category: software-development
    version: "1.1.0"
    g7_phase: DETECT
    role: "4-phase root cause debugging: understand bugs before fixing"
    self_improve_mechanism: "Root cause identification feeds DETECT phase; prevents symptom patching"
    autonomy_level: "assists human/agent in diagnosis"
    notes: "Iron Law: NO FIXES WITHOUT ROOT CAUSE INVESTIGATION FIRST"

  - name: requesting-code-review
    category: software-development
    version: "2.0.0"
    g7_phase: VALIDATE
    role: "Pre-commit review: security scan, quality gates, auto-fix loop"
    self_improve_mechanism: "Independent reviewer subagent validates changes before integration"
    autonomy_level: "automated verification; auto-fix loop for trivial issues"
    notes: "Core principle: No agent should verify its own work"

  - name: test-driven-development
    category: software-development
    version: "1.1.0"
    g7_phase: VALIDATE
    role: "TDD: enforce RED-GREEN-REFACTOR, tests before code"
    self_improve_mechanism: "Tests validate that improvements do not regress"
    autonomy_level: "automated test execution"
    notes: "Related to systematic-debugging"

  - name: simplify-code
    category: software-development
    version: "1.0.0"
    g7_phase: IMPROVE
    role: "Parallel 3-agent cleanup of recent code changes"
    self_improve_mechanism: "Three narrow reviewers (reuse, quality, efficiency) find improvement opportunities"
    autonomy_level: "automated review; fixes applied after aggregation"
    notes: "Uses delegate_task for parallel subagents"

  - name: plan
    category: software-development
    version: "2.0.0"
    g7_phase: ACQUIRE
    role: "Plan mode: write actionable markdown plan, no execution"
    self_improve_mechanism: "DRAFT phase: improvement proposals are plans before codegen"
    autonomy_level: "advisory — plan only, no execution"
    notes: "Aligns with SDD: spec-first approach"

  - name: spike
    category: software-development
    version: "1.0.0"
    g7_phase: VALIDATE
    role: "Throwaway experiments to validate an idea before build"
    self_improve_mechanism: "Prototype dune validation: test improvement feasibility before integration"
    autonomy_level: "prototype dune only; disposable"
    notes: "Maps to G6 prototype_dune concept"

  - name: hermes-agent-skill-authoring
    category: software-development
    version: "1.1.0"
    g7_phase: ACQUIRE
    role: "Author in-repo SKILL.md: frontmatter, validator, structure"
    self_improve_mechanism: "T3 skill generation: provides template and quality standards for generated skills"
    autonomy_level: "assists agent in skill creation; does not auto-commit"
    notes: "Key enabler for autonomous skill acquisition"

  - name: adversarial-ux-test
    category: qa
    version: "1.0.0"
    g7_phase: DETECT
    role: "Roleplay difficult user, find UX pain points, create actionable tickets"
    self_improve_mechanism: "Finds friction that technical QA misses; feeds DETECT phase"
    autonomy_level: "automated testing; pragmatism filter separates real issues from noise"
    notes: "Related to G5 Red Team"

  - name: dogfood
    category: qa
    version: "1.0.0"
    g7_phase: DETECT
    role: "Exploratory QA of web apps: find bugs, evidence, reports"
    self_improve_mechanism: "Systematic exploratory testing surfaces failure patterns"
    autonomy_level: "automated testing"
    notes: "Uses browser toolset"

  - name: github-code-review
    category: github
    version: "1.1.0"
    g7_phase: VALIDATE
    role: "Review PRs: diffs, inline comments via gh or REST"
    self_improve_mechanism: "PR-level validation of proposed improvements"
    autonomy_level: "advisory — comments, not auto-merge"
    notes: "Feeds HITL review queue"

# ---------------------------------------------------------------------------
# 3. Hermes Native Learning Loop Support
# ---------------------------------------------------------------------------
hermes_native_mechanisms:
  - mechanism: skill_manage
    tool: skill_manage
    g7_phase: ACQUIRE
    role: "Create, patch, edit, delete skills programmatically"
    self_improve_use: "T3 skill generation: agent drafts new SKILL.md via skill_manage(action=create)"
    autonomy_level: "agent can draft; HITL for production integration"
    notes: "Generated skills go to profile skills/ directory"

  - mechanism: memory
    tool: memory
    g7_phase: MEASURE
    role: "Persistent memory across sessions (facts, preferences, corrections)"
    self_improve_use: "Records what was learned from improvement cycles; prevents repeating failed approaches"
    autonomy_level: "agent can add/replace/remove memories"
    notes: "Injected into every future turn — compact and high-signal"

  - mechanism: honcho_conclude
    tool: honcho_conclude
    g7_phase: MEASURE
    role: "Persistent derived facts about a peer that feeds long-term profile"
    self_improve_use: "Records stable preferences and corrections learned during improvement cycles"
    autonomy_level: "agent can create conclusions"
    notes: "Honcho self-heals contradictions over time"

  - mechanism: honcho_search
    tool: honcho_search
    g7_phase: DETECT
    role: "Hybrid semantic + keyword search over peer message history"
    self_improve_use: "Recall past failure patterns and resolutions for DETECT phase"
    autonomy_level: "read-only retrieval"
    notes: "Cheaper than honcho_reasoning"

  - mechanism: honcho_reasoning
    tool: honcho_reasoning
    g7_phase: DETECT
    role: "Synthesized answers about a peer via LLM reasoning"
    self_improve_use: "Deep pattern analysis for complex failure detection"
    autonomy_level: "read-only retrieval"
    notes: "Most expensive Honcho call; use sparingly"

  - mechanism: session_search
    tool: session_search
    g7_phase: DETECT
    role: "FTS5 search over local session DB"
    self_improve_use: "Find past conversations about similar failures; recall resolutions"
    autonomy_level: "read-only retrieval"
    notes: "No LLM calls — returns raw messages"

  - mechanism: delegate_task
    tool: delegate_task
    g7_phase: VALIDATE
    role: "Spawn subagents for isolated task execution"
    self_improve_use: "Independent validation of improvement proposals; fresh context review"
    autonomy_level: "agent can spawn up to 3 concurrent children"
    notes: "max_spawn_depth=1 (leaves cannot delegate)"

  - mechanism: cronjob
    tool: cronjob
    g7_phase: MEASURE
    role: "Scheduled recurring jobs"
    self_improve_use: "Periodic monitoring: degradation checks, thrashing detection, regression window scans"
    autonomy_level: "agent can create; jobs run autonomously"
    notes: "Can attach skills to cron jobs for scheduled improvement cycles"

  - mechanism: todo
    tool: todo
    g7_phase: ACQUIRE
    role: "Task list management for multi-step work"
    self_improve_use: "Tracks improvement proposal state through DRAFT-DEBUG-IMPROVE-PIVOT-REFINE cycle"
    autonomy_level: "agent-managed"
    notes: "Internal tracking only; not persistent"

# ---------------------------------------------------------------------------
# 4. agentskills.io Pattern Analysis
# ---------------------------------------------------------------------------
agentskills_io_patterns:
  format: "progressive-disclosure L1-L2-L3"
  l1_metadata_budget: "50 tokens for frontmatter"
  l2_body: "on trigger match"
  l3_references: "on demand (references/assets/scripts)"
  co_load_limit: "5-15 skills per session (G3 rule)"

  applicable_patterns:
    - pattern: "Trigger-based activation"
      description: "Skill loads only when its trigger condition matches the current task"
      g7_use: "Generated skills must have non-ambiguous triggers matching detected gap classes"
      source: "WP-S3"

    - pattern: "Progressive disclosure"
      description: "L1 always loaded; L2 on trigger; L3 on demand"
      g7_use: "Generated skills follow L1-L2-L3 structure; token economics enforced"
      source: "WP-S3"

    - pattern: "Sandboxed execution"
      description: "Skills that execute code run in isolated sandbox"
      g7_use: "T3 skill validation runs in prototype dune (G6 sandbox)"
      source: "WP-S1"

    - pattern: "Composable skills"
      description: "Skills can reference and depend on other skills"
      g7_use: "Generated skills declare related_skills in frontmatter"
      source: "agentskills.io"

