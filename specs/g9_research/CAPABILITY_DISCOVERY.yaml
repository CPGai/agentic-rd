    option_2_eligible: true
    skill_link: null
    notes: "Biomedical literature; NCBI E-utilities esearch + efetch"

  - id: API-03
    name: "IEEE Xplore API"
    endpoint: "https://ieeexploreapi.ieee.org/api/v1/"
    protocol: "REST (JSON)"
    auth: "API key required (institutional)"
