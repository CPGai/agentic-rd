    auth: "none (rate-limited)"
    rate_limit: "1 request / 3 seconds"
    coverage: "physics, math, CS, quantitative biology, quantitative finance, statistics, EE"
    paper_metadata: "title, authors, abstract, DOI, published date, categories"
    full_text: "PDF link (unauthenticated download)"
