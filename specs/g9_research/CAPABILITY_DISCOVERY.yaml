    paper_metadata: "title, authors, abstract, DOI, concepts, institutions, cited_by_count, open access"
    full_text: "open access PDF link when available"
    procurement_tier: T1
    option_2_eligible: true
    skill_link: null
    notes: "Replacement for Microsoft Academic Graph; broad coverage"

  - id: API-06
    name: "Crossref API"
    endpoint: "https://api.crossref.org/"
    protocol: "REST (JSON)"
    auth: "none (polite pool with mailto)"
    rate_limit: "50 requests / second (polite pool)"
    coverage: "all DOI-registered works (150M+)"
    paper_metadata: "title, authors, DOI, container-title, published date, references"
    full_text: "link to publisher (no full text)"
    procurement_tier: T1
    option_2_eligible: true
    skill_link: null
    notes: "DOI metadata resolution; reference list extraction"

  - id: API-07
    name: "CORE API"
    endpoint: "https://core.ac.uk:443/api-v2/"
    protocol: "REST (JSON)"
    auth: "API key required"
    rate_limit: "varies by tier"
    coverage: "open access papers (200M+ from repositories worldwide)"
