    paper_metadata: "title, authors, abstract, DOI, conference/journal"
    full_text: "link to IEEE (subscription required)"
    procurement_tier: T2
    option_2_eligible: true
    skill_link: null
    notes: "Requires institutional API key; HITL HG-RS-02 for access"

  - id: API-04
    name: "Semantic Scholar API"
    endpoint: "https://api.semanticscholar.org/graph/v1/"
    protocol: "REST (JSON)"
    auth: "API key recommended (x-api-key header)"
    rate_limit: "100 requests / 5 minutes (unauthenticated); higher with key"
    coverage: "all CS, broad academic (200M+ papers)"
    paper_metadata: "title, authors, abstract, DOI, citations, references, TLDR, S2 fields of study"
    full_text: "open access PDF link when available"
    procurement_tier: T1
    option_2_eligible: true
    skill_link: null
    notes: "Citation graph traversal; TLDR auto-summary; reference extraction"

