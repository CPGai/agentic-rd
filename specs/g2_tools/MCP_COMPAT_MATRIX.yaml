    selected_path: OPTION_2_STANDARD
    resume_token: G2_TOOL_REGISTRY_LOCKED_v1

# ---------------------------------------------------------------------------
# Option matrix (mirrors BLUE G2; decision by human only)
# ---------------------------------------------------------------------------
options:
  OPTION_1_CONSERVATIVE:
    summary: T1 skills/native only; disable new MCP bind surface
    allows_tiers: [T1]
    mcp: disable_or_skill_wrap_only
  OPTION_2_STANDARD:
    summary: T1 + T2 MCP with broker ACLs + progressive disclosure
    allows_tiers: [T1, T2]
    mcp: allowlisted_only
    recommended: true
  OPTION_3_CREATIVE:
    summary: T1–T4 paths + live AP2 limits UI + A2UI sheet-music
    allows_tiers: [T1, T2, T3, T4]
    requires_extra: [red_team, payment_harness, a2ui_catalog_lock]
