    - private_registry
    - public_marketplace_later
  connection_patterns: [direct_endpoint, registry_resolve]
  extensions:
    a2ui:
      enabled_option_2: false
      security_model: trusted_component_catalog_only
      catalog_default: basic_v0.9
      production_catalog: byo_design_system
      xss_rule: no_executable_ui_code_from_model
      anchors: [WP-S2:p32-p43]
    ucp:
      enabled_option_2: false
      role: catalog_cart_order
      anchors: [WP-S2:p45]
    ap2:
      enabled_option_2: false
      role: signed_mandate_payments
      requires: [merchant_allowlist, spending_limit, cryptographic_mandate]
      hitl: always
      anchors: [WP-S2:p46]
    x402_l402:
      enabled_option_2: false
      role: micro_payment_http_402
      anchors: [WP-S2:p30-p31]

