# ---------------------------------------------------------------------------
# HITL telemetry bundle (REQUIRED_TELEMETRY for gate)
# ---------------------------------------------------------------------------
hitl_telemetry:
  tier4_items_count: 0
  unauthenticated_mcp_servers: [context7]
  unauthenticated_mcp_count: 1
  audit_severity_counts:
    critical_open: 0
    high_open: 0  # hermes-api-bridge rebound to 127.0.0.1:8642
    medium_open: 2  # honcho AUTH_USE_AUTH=false local; context7 unauth docs egress
    low_open: 1     # missing convenience CLIs in WSL PATH
    high_closed_this_lock: 2  # context7 floated npx → pinned 1.0.6; hermes-api-bridge 0.0.0.0 → 127.0.0.1
  artifacts:
    - specs/g2_tools/TOOL_REGISTRY.md
    - specs/g2_tools/MCP_COMPAT_MATRIX.yaml
    - specs/g2_tools/PROCUREMENT_TIER_MATRIX.yaml
