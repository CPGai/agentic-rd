    - specs/g2_tools/timeout_budgets.yaml
    - specs/g2_tools/TOOL_DISCLOSURE_POLICY.md
    - specs/g2_tools/skills_registry.json
    - specs/g2_tools/pins/npm-mcp-pins.json
  deferred_step_d_ext: []
  deferred_steps: []
  completed_steps: [A, B, C, D, E, F]
  gate:
