schema_version: "1.0.0"
domain: G2
artifact: broker_config
status: LOCKED_SCHEMA
selected_path: OPTION_2_STANDARD
resume_token: G2_TOOL_REGISTRY_LOCKED_v1
implementation_state: DECLARED_NOT_WIRED
generated_at: "2026-07-23"

identity:
  broker_id: agentic-rd-mcp-broker
  environment: wsl-runtime
  substrate: WSL2_Ubuntu-24.04
  profile: wsl-runtime
  tenant_mode: single_tenant_dev
  supervisor: constraint_harness

tenant_scoping:
  default_tenant: local-dev
  require_tenant_header: false
  isolation:
    cross_profile_writes: deny
    cross_tenant_tool_state: deny

apiVersion: agentic-rd/g2/v1
kind: McpBrokerConfig
metadata:
  name: mcp-security-broker
  version: "3.0.0"
  state_token: G2_TOOL_REGISTRY_LOCKED_v1

broker:
  listen_mode: in_process  # in_process | stdio_wrap
  fail_closed: true
  strict_jsonrpc: true
  reject_extra_properties: true
  max_request_bytes: 1048576
  max_response_bytes: 4194304
  request_timeout_seconds: 30
  upstream_connect_timeout_seconds: 10

paths:
  root: /home/carlospg/workspace/agentic-rd
  acl: specs/g2_tools/security_acl.yaml
  disclosure: specs/g2_tools/disclosure_policy.yaml
  audit_log: var/log/mcp_broker_audit.jsonl

jsonrpc:
  supported_version: "2.0"
  allowed_methods:
    - initialize
    - ping
    - tools/list
    - tools/call
  error_codes:
    parse_error: -32700
    invalid_request: -32600
    method_not_found: -32601
    invalid_params: -32602
    internal_error: -32603
    security_violation: -32000
    content_blocked: -32001

policy:
  allowed_tiers: [T1, T2]
  conditional_tiers: [T3]
  denied_tiers: [T4]
  require_allowlist: true
  require_pin_for_mcp: true
  annotations_trust: never_for_authz
  public_unverified_mcp: deny
  progressive_disclosure: rag_for_tools
  audit_log: true
  redact_secrets: true
  network_boundary:
    enforce_loopback: true
    allowed_bind_addresses:
      - "127.0.0.1"
      - "::1"
    services:
      - service_id: hermes-api-bridge
        host: "127.0.0.1"
        port: 8642
        allowed_interface: loopback_only

acls:
  servers:
    - server_id: context7
      enabled: true
      tier: T2
      transport: stdio
      authenticated: false
      max_rps: 2
      max_concurrent: 1
      tools_allow:
        - resolve-library-id
        - query-docs
        - list_prompts
        - get_prompt
        - list_resources
        - read_resource
      tools_deny: []
      arg_guards:
        - tool: query-docs
          rules:
            - field: query
              deny_regexes:
                - "(?i)(api[_-]?key|password|secret|bearer\\s+[a-z0-9._\\-]+)"
                - "(?i)(BEGIN (RSA |OPENSSH )?PRIVATE KEY)"
            - field: libraryId
              allow_regex: "^/[A-Za-z0-9._\\-]+(/[A-Za-z0-9._\\-]+)+$"
      output_sanitization:
        strip_patterns:
          - "(?i)sk-[a-z0-9]{10,}"
          - "(?i)bearer\\s+[a-z0-9\\-._~+/]+=*"
        strip_html_active: true
        max_content_chars: 24000
      pin:
        package: "@upstash/context7-mcp"
        version: "1.0.6"
        manager: npm
        enforce: true
    - server_id: public_unverified_wildcard
      enabled: false
      tier: T4
      tools_allow: []
      tools_deny:
        - "*"

  native_action_guards:
    - action_class: exec_shell
      hitl: smart
      wsl2_required: true
    - action_class: destructive_fs
      hitl: always
    - action_class: network_egress_new_host
      hitl: always
    - action_class: payment
      hitl: always
      live: false

sanitizer:
  enabled: true
  action_on_match: reject  # reject | sanitize
  max_string_length: 65536
  path_traversal_patterns:
    - '\\.\\.\\/'
    - '\\.\\.\\\\'
    - '%2e%2e%2f'
    - '%2e%2e/'
    - '..%2f'
    - '%252e%252e%252f'
  shell_metacharacter_pattern: '[;&|`$(){}\[\]<>]'
  command_injection_patterns:
    - '(?i)\b(curl|wget|nc|ncat|bash|sh|zsh|powershell|pwsh|cmd\.exe|python|perl|ruby)\b'
    - '(?i)\b(rm\s+-rf|mkfs|dd\s+if=|:(){:|:&};:)\b'
    - '(?i)\beval\s*\('
    - '(?i)\bexec\s*\('
    - '(?i)\bos\.system\b'
    - '(?i)\bsubprocess\b'
    - '(?i)\b(__import__|compile)\b'
  prompt_injection_markers:
    - '(?i)ignore\s+(all\s+)?(previous|prior|above)\s+instructions'
    - '(?i)disregard\s+(all\s+)?(previous|prior)\s+(instructions|rules)'
    - '(?i)you\s+are\s+now\s+(in\s+)?(dan|developer|jailbreak)\s+mode'
    - '(?i)system\s*:\s*you\s+are'
    - '(?i)<\|?(system|im_start|endoftext)\|?>'
    - '(?i)\[INST\]'
    - '(?i)###\s*(system|instruction)'
    - '(?i)do\s+not\s+follow\s+your\s+(original\s+)?(safety\s+)?(policy|guidelines)'
    - '(?i)reveal\s+(your\s+)?(system\s+)?prompt'
    - '(?i)tool_call\s*=\s*\{'

post_hook:
  enabled: true
  action_on_match: redact  # redact | reject | wrap
  redaction_token: "[REDACTED_INJECTION_CANDIDATE]"
  wrap_prefix: "SECURITY_NOTICE: The following tool output contained patterns consistent with indirect prompt injection and was sanitized.\n---\n"
  wrap_suffix: "\n---\nEND_SANITIZED_OUTPUT"
  result_injection_patterns:
    - '(?i)ignore\s+(all\s+)?(previous|prior|above)\s+instructions'
    - '(?i)disregard\s+(your\s+)?(safety|content)\s+policy'
    - '(?i)as\s+an\s+ai\s+(language\s+)?model.*(ignore|override)'
    - '(?i)new\s+instructions\s+for\s+you\s*:'
    - '(?i)call\s+the\s+tool\s+[a-z0-9_\.]+\s+with'
    - '(?i)IMPORTANT:\s*override\s+tool\s+policy'

response_sanitization:
  enabled: true
  validate_output_schema_when_present: true
  taint_untrusted_mcp_content: true
  block_resource_urls_not_allowlisted: true
  resource_url_allowlist: []

collision_detection:
  enabled: true
  on_exact_name_collision: block_new
  on_semantic_similarity:
    enabled: true
    threshold: 0.86
    action: hitl_review
  shadowing_control_id: SEC-SH-01

dynamic_capability_guard:
  control_id: SEC-DYN-01
  on_connect: tools_list_and_pin_compare
  on_list_changed: revalidate_or_disconnect
  on_hash_mismatch: disconnect_and_alert
  silent_tool_add_without_allowlist_amend: deny

confused_deputy_controls:
  control_ids:
    - SEC-CD-01
    - SEC-CD-02
  rules:
    - never_forward_user_free_text_to_privileged_backend_without_sanitize
    - authorize_as_end_user_not_only_server_service_identity
    - deny_broad_repo_credentials_on_docs_only_servers

rate_limits:
  default_rps: 5
  default_burst: 10
  per_server_override_from_acl: true
  on_exceed: error_backoff_observation

timeouts_ref: specs/g2_tools/timeout_budgets.yaml
disclosure_ref: specs/g2_tools/TOOL_DISCLOSURE_POLICY.md
tier_matrix_ref: specs/g2_tools/PROCUREMENT_TIER_MATRIX.yaml
compat_matrix_ref: specs/g2_tools/MCP_COMPAT_MATRIX.yaml
pins_ref: specs/g2_tools/pins/npm-mcp-pins.json

upstream_servers:
  native_cli:
    transport: in_process
    description: "Native high-privilege local tools"
  context7:
    transport: streamable_http
    base_url_env: CONTEXT7_MCP_URL
    description: "Context7 documentation MCP"
  filesystem:
    transport: stdio
    command:
      - /home/carlospg/workspace/agentic-rd/.venv-hermes/bin/python3
      - -m
      - mcp_server_filesystem
    description: "Scoped filesystem MCP"

audit:
  enabled: true
  log_all_calls: true
  log_denies: true
  include_payload_hash: true
  fields:
    - timestamp
    - tenant
    - server_id
    - tool_name
    - args_hash
    - decision
    - latency_ms
    - is_error
    - taint_out
  retention_days_dev: 30

sequence_ref: specs/g2_tools/TOOL_CALL_SEQUENCE.md
