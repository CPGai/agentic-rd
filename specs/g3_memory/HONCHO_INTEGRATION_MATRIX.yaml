      status: Up_healthy
      ports: "127.0.0.1:8000->8000/tcp"
    - name: honcho-deriver-1
      status: Up
      ports: "8000/tcp (internal)"
    - name: honcho-database-1
      status: Up_healthy
      image: pgvector/pgvector:pg15
      ports: "127.0.0.1:5432->5432/tcp"
    - name: honcho-redis-1
      status: Up_healthy
      ports: "127.0.0.1:6379->6379/tcp"
  residual_sidecars_out_of_g3_runtime_scope:
    - name: hermes-api-bridge
      ports: "0.0.0.0:8642->8642/tcp"
