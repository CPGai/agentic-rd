    - .env.template

# ---------------------------------------------------------------------------
hermes_client:
  profile: wsl-runtime
  config_path_windows: "C:/Users/carlo/AppData/Local/hermes/profiles/wsl-runtime/config.yaml"
  memory:
    memory_enabled: true
    provider: honcho
    # durable product notes (session L1 memory); not secrets
    session_strategy: per-directory
    recall_mode: hybrid
    user_profile_enabled: true
  security_hooks:
    redact_secrets: true
  tools_surface_to_agent:
    - honcho_profile
    - honcho_context
    - honcho_search
    - honcho_reasoning
    - honcho_conclude

# ---------------------------------------------------------------------------
services:
  api:
    role: HTTP identity/memory plane
    container: honcho-api-1
    listen: loopback:8000
    healthcheck_path: /health
    openapi_prefix: /v3
  deriver:
    role: Async extract / consolidate / representation batching
    container: honcho-deriver-1
    enabled: true
    workers_default: 1
    deduplicate: true
  database:
    role: Durable relational + pgvector
    container: honcho-database-1
    engine: postgres
    extension: pgvector
    major: 15
    listen: loopback:5432
    auth_method_live_note: "POSTGRES_HOST_AUTH_METHOD=trust in compose — local-dev posture"
  redis:
    role: Cache / queue assist
    container: honcho-redis-1
    listen: loopback:6379
    cache_enabled_in_compose: true
  vector_store:
    type: pgvector
    namespace_default: honcho
    embedding:
      transport_template: openai_compatible
      model_template: text-embedding-3-small
      vector_dimensions: 1536
    migrated_flag_template: false

# ---------------------------------------------------------------------------
# Derive / dialectic model routing — dynamic tier labels ONLY in constitution style;
# concrete IDs below are OBSERVED LOCAL CONFIG pins for telemetry, not global freezes.
derive_model:
  role: Honcho deriver LLM (observation/conclusion extraction)
  observed_transport: openai_compatible
  observed_base_url: https://openrouter.ai/api/v1
  # Product memory / user durable note (isolated key for usage monitoring):
  observed_model_id: deepseek/deepseek-v4-flash
  observed_model_source: "session durable memory + live .env DERIVER_MODEL_CONFIG__* via OpenRouter"
  config_template_default_in_repo_example: gpt-5.4-mini
  template_vs_live: "config.toml.example defaults differ from live .env — live wins for this host"
  api_key_policy: "Isolated OpenRouter key in Honcho .env only; never copy into specs/transcripts"
  workspace_model_routing_note: >
    Agent turns still use Hermes dynamic Premium/Strong/Flash matrix.
    Deriver model is a side-car cost center, not the main agent pin.

dialectic_levels_template:
  # From config.toml.example — ceilings enforced by provider; values not echoed if secret-shaped
  levels: [minimal, low, medium, high, max]
  tool_iterations:
    minimal: 1
    low: 5
    medium: 2
    high: 4
    max: 10
  usage_policy_option_2:
    default_agent_reason_level: low
    reserve_high_max_for: "deep multi-hop peer synthesis only"
    prefer_cheaper_paths:
      - honcho_profile
      - honcho_context
      - honcho_search

summary_service_template:
  enabled: true
  messages_per_short_summary: 20
  messages_per_long_summary: 60
  aligns_to_session_state_spec_triggers: true

dream_service_template:
  enabled_template: true
  option_2_posture: "Allow local dream/consolidation; forbid dream outputs from auto-editing skills (no L4)"
  min_hours_between_dreams: 8
  idle_timeout_minutes: 60

# ---------------------------------------------------------------------------
auth_privacy:
  auth_use_auth_live: false
  auth_risk: MED
  auth_risk_owner:
    - G3_policy_declare
    - G8_hardening
  jwt_secret_in_specs: FORBIDDEN
  redaction_filters:
    pre_persist:
      - secret_patterns_api_keys_tokens_passwords
      - bearer_headers
      - private_key_blocks
    harness_hooks:
      - security.redact_secrets: true
    write_path_hooks:
      - on_memory_write
      - on_pre_model
    pii_policy: "Redact or minimize PII before session/memory persist (WP-F3 production guidance)"
    conclude_delete_path: "honcho_conclude delete_id for PII removal only; prefer corrective conclude for wrong facts"
  isolation:
    session_acl: principal_owned
    cross_profile_writes: denied_by_default
    multi_tenant_full_controls: deferred_G8

# ---------------------------------------------------------------------------
rate_token_ceilings:
  # Declarative ceilings for OPTION_2. Runtime may tighten, never silently loosen blockers.
  agent_context_window:
    static_pack_max_share: 0.20
    pinned_memory_share: [0.02, 0.05]
    dynamic_share: [0.40, 0.60]
    reserve_share: [0.10, 0.15]
  session_compaction:
    short_summary_every_messages: 20
    long_summary_every_messages: 60
    emergency_fill_ratio: 0.85
    soft_pressure_fill_ratio: 0.70
  skill_co_load:
    soft_max_l2_bodies: 3
    flag_if_l2_chars_over: 32000  # ~8k tok rough hedge @4 chars/tok
    l1_target_tokens_per_skill: 50
    l1_hedge_tokens_per_skill: 80
  honcho_client_calls:
    profile_card: unlimited_cheap
    context_snapshot: prefer_over_reasoning
    search_max_tokens_default: 800
    search_max_tokens_cap: 2000
    reasoning_levels_allowed: [minimal, low, medium, high, max]
    reasoning_default: low
    conclude_writes_require: "durable fact or PII delete only — not task logs"
  deriver_cost_guard:
    isolated_api_key_required: true
    log_secrets: false
    max_custom_instructions_tokens: ENFORCED_BY_SERVER
  message_size_template:
    max_message_size_chars: 25000
    max_message_content_chars_in_tool_results: 2000
    max_file_size_bytes: 5242880

