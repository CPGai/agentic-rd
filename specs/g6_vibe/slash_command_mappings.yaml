# ---------------------------------------------------------------------------
# BLUE-specified slash commands (from BLUE §G6 L351)
# ---------------------------------------------------------------------------
blue_commands:

  /goal:
    id: CMD_GOAL
    blue_reference: "BLUE §G1 L52, §G6 L351"
    hermes_native: true
    hermes_command: "/goal [text|sub]"
    cli_equivalent: "N/A (in-session only)"
    description: "Set a standing goal Hermes works on across turns until achieved"
    subcommands: [status, pause, resume, clear]
    model_tier: varies_by_goal
    vibe_spectrum: structured_assisted_to_agentic
    conductor_mode: true
    orchestrator_mode: true
    production_path: true
    prototype_dune: true
    notes: "Primary mechanism for Orchestrator-mode async delegation. Goal persists across turns."
    g5_integration:
      trajectory_emission: true
      trust_score: advisory
    usage_examples:
      - "/goal Scaffold project constitution from HARNESS_SPEC.md"
      - "/goal Scaffold MCP broker from TOOL_REGISTRY.md"
      - "/goal status"

  /grill-me:
    id: CMD_GRILL_ME
    blue_reference: "BLUE §G1 L58, §G2 L141, §G3 L223, §G6 L351"
    hermes_native: false
    status: BLUE_META_PROMPT_CONVENTION
    description: "Use for any ambiguity before proceeding with codegen — enforces spec-first discipline"
    model_tier: premium_frontier
    vibe_spectrum: agentic_engineering
    conductor_mode: false
    orchestrator_mode: true
    production_path: true
    prototype_dune: false
    notes: "Not a Hermes-native command. BLUE Meta-Prompt convention that instructs the agent to interrogate ambiguity before codegen. Implemented as a prompt pattern, not a slash command."
    implementation_pattern: "Before any codegen step, the agent must surface ambiguities and request clarification. This is enforced by AGENTS.md §2 (Glass-box: explanation precedes execution)."
    g5_integration:
      trajectory_emission: true
      trust_score: enforced
    usage_in_blue:
      - "G1 Step D: Use /grill-me first for any ambiguity. No agent logic code."
      - "G2 Step D: Use /grill-me for any Tier-4 gap. No implementation code."
      - "G3 Step D: Use /grill-me on co-load precedence. No executable logic."
    mapping_to_hermes: "Use /steer to inject ambiguity-check mid-loop, or rely on AGENTS.md Glass-box rule"

  /browser:
    id: CMD_BROWSER
    blue_reference: "BLUE §G6 L351"
    hermes_native: true
    hermes_command: "/browser"
    description: "Open CDP browser connection for UI testing and web interaction"
    model_tier: strong_coding
    vibe_spectrum: structured_assisted_to_agentic
    conductor_mode: true
    orchestrator_mode: true
    production_path: true
    prototype_dune: true
    related_skill: computer-use
    notes: "Enables agent to test UI, verify visual output, interact with web pages. Uses Chrome DevTools Protocol."
    g5_integration:
      trajectory_emission: true
      trust_score: advisory
    usage_examples:
      - "/browser (opens CDP connection)"
      - "Then agent can navigate, click, screenshot, verify UI state"

  /schedule:
    id: CMD_SCHEDULE
    blue_reference: "BLUE §G6 L351"
    hermes_native: true
    hermes_command: "/cron"
    cli_equivalent: "hermes cron <verb>"
    description: "Manage cron jobs — scheduled task execution and multi-platform delivery"
    model_tier: fast_flash
    vibe_spectrum: agentic_engineering
    conductor_mode: false
    orchestrator_mode: true
    production_path: true
    prototype_dune: false
    subcommands: [list, create, edit, pause, resume, run, remove, status]
    features:
      - "skills_preload: load ordered skills before prompt"
      - "model_override: pin model per job"
      - "script_pre_run: collect data before agent runs"
      - "no_agent: script-only watchdog (silent on empty output)"
      - "context_from: chain job outputs"
      - "workdir: run in specific directory with AGENTS.md loaded"
      - "multi_platform_delivery: deliver to any connected channel"
    invariants:
      - "3-minute hard interrupt per run"
      - ".tick.lock prevents duplicate ticks"
      - "skip_memory=True by default"
      - "cron deliveries framed with header/footer"
    notes: "Durable scheduler; survives process restart. Primary tool for Orchestrator-mode async monitoring."
    g5_integration:
      trajectory_emission: true
      trust_score: enforced
    usage_examples:
      - "/cron create 30m  # every 30 minutes"
      - "/cron list"
      - "/cron pause <id>"
      - "hermes cron create '0 9 * * *'  # daily at 9am"

