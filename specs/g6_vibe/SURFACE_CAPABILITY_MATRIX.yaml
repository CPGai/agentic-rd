# ---------------------------------------------------------------------------
# Durable systems (from hermes-agent skill)
# ---------------------------------------------------------------------------
durable_systems:
  delegation:
    tool: delegate_task
    kind: subagent_spawn
    durability: process_local
    max_concurrent_children: 3
    max_spawn_depth: 1
    roles: [leaf, orchestrator]
    notes: "Not durable; if parent exits, children lost. Use cronjob for durable work."

  cron:
    tool: cronjob
    kind: scheduled_jobs
    durability: durable
    cli: "hermes cron <verb>"
    slash: "/cron"
    features: [skills_preload, model_override, script_pre_run, context_chaining, workdir, multi_platform_delivery]
    invariants:
      - "3-minute hard interrupt per run"
      - ".tick.lock prevents duplicate ticks"
      - "skip_memory=True by default"
      - "cron deliveries framed with header/footer"

  curator:
    tool: hermes_curator
    kind: skill_lifecycle
    durability: durable
    cli: "hermes curator <verb>"
    slash: "/curator"
    scope: "only touches skills with created_by: agent provenance"
    max_destructive: archive
    pinned_exempt: true

