# ---------------------------------------------------------------------------
# BLUE-specified slash commands (from BLUE §G6 L351)
# ---------------------------------------------------------------------------
blue_slash_commands:
  /goal:
    command: "/goal [text|sub]"
    surface: hermes_cli
    description: "Set a standing goal Hermes works on across turns until achieved"
    subcommands: [status, pause, resume, clear]
    model_tier: varies_by_goal
    vibe_spectrum: structured_assisted_to_agentic
    notes: "Primary mechanism for Orchestrator-mode async delegation"

  /grill-me:
    command: "/grill-me"
    surface: blue_meta_prompt
    description: "BLUE Meta-Prompt: use for any ambiguity before proceeding with codegen"
    model_tier: premium_frontier
    vibe_spectrum: agentic_engineering
    notes: "Enforces spec-first discipline; prevents vibe coding on production paths"
    usage_in_blue:
      - "G1 Step D: Use /grill-me first for any ambiguity"
      - "G2 Step D: Use /grill-me for any Tier-4 gap"
      - "G3 Step D: Use /grill-me on co-load precedence"

  /browser:
    command: "/browser"
    surface: hermes_cli
    description: "Open CDP browser connection for UI testing and web interaction"
    model_tier: strong_coding
    vibe_spectrum: structured_assisted_to_agentic
    notes: "Enables agent to test UI, verify visual output, interact with web pages"
    related_skill: computer-use

  /schedule:
    command: "/cron"
    surface: hermes_cli
    description: "Manage cron jobs — scheduled task execution and delivery"
    model_tier: fast_flash
    vibe_spectrum: agentic_engineering
    notes: "Durable scheduler; cronjob tool is the programmatic interface"
    subcommands: [list, create, edit, pause, resume, run, remove, status]
    cli_equivalent: "hermes cron <verb>"

# ---------------------------------------------------------------------------
# Hooks (lifecycle intercepts)
# ---------------------------------------------------------------------------
hooks:
  pre_tool:
    kind: deterministic
    layer: L0_hooks
    description: "Deterministic code that runs before a tool call"
    enforced_by: constraint_harness
    g5_mapping: "OTEL span start on tool/delegate spans"

  post_file_edit:
    kind: deterministic
    layer: L0_hooks
    description: "Runs after a file edit — syntax check, lint, format"
    enforced_by: constraint_harness
    g5_mapping: "trajectory Observation capture"

  pre_commit:
    kind: deterministic
    layer: L0_hooks
    description: "Runs before a git commit — secret scan, structural test"
    enforced_by: constraint_harness
    g5_mapping: "checkpoint protocol (git checkpoint ref)"

  approval_bypass:
    kind: toggle
    layer: L0_hooks
    command: "/yolo"
    description: "Toggle approval bypass — VIBE CODING MODE"
    warning: "Must be confined to prototype dunes; never active on production paths"
    g5_mapping: "circuit breaker disabled in yolo; trust score not enforced"

