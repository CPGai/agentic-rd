# observability_pipelines.yaml
# G8 — PII-Redacted OpenTelemetry Routing
# Status: DRAFT_PRE_GATE
# Overlay: OPTION_2_STANDARD
# Upstream: self-improvement-v1.0.0 (G7 LOCKED)
# BLUE resume: G8_MULTITENANT_APPROVED_v1
# Tier: Strong Coding (Step D)
#
# Defines per-tenant OTEL pipelines with mandatory PII redaction before export.
# Inherits G5 OBSERVABILITY_PILLARS_SPEC.yaml and adds per-tenant scoping.
# All telemetry is tenant-scoped; no cross-tenant trace/log/metric leakage.

version: "1.0.0-draft"
domain: G8
kind: observability_pipelines
status: DRAFT_PRE_GATE
overlay: OPTION_2_STANDARD
upstream_tag: self-improvement-v1.0.0
blue_resume_token: G8_MULTITENANT_APPROVED_v1

# ---------------------------------------------------------------------------
# 1. Per-Tenant OTEL Pipeline Architecture
# ---------------------------------------------------------------------------
pipeline_architecture:
  collector: "otelcol-contrib"
  deployment: "per-tenant collector instance (or multi-tenant collector with tenant_id routing)"
  redaction_stage: "pre-export (always-on)"
  llm_advisory: "advisory only; never bypasses deterministic redaction"

  data_flow:
    - step: 1
      stage: "ingest"
      description: "Agent emits OTEL spans/logs/metrics with tenant_id attribute"
      tenant_scoping: "tenant_id in every span/log/metric"
    - step: 2
      stage: "redact"
      description: "Deterministic PII redaction filter processes all telemetry"
      deterministic: true
      non_delegatable: true
      control_id: "C-MT-08"
    - step: 3
      stage: "llm_advisory"
      description: "LLM evaluates for implicit PII (advisory only)"
      advisory: true
      on_flag: "escalate to hitl; do not block export"
    - step: 4
      stage: "route"
      description: "Route to per-tenant export backend based on tenant_id"
      routing_key: "tenant_id"
      cross_tenant: "denied"
    - step: 5
      stage: "export"
      description: "Export to tenant-specific backend (OTLP, Jaeger, Prometheus)"
      per_tenant: true

# ---------------------------------------------------------------------------
# 2. PII Redaction Configuration
# ---------------------------------------------------------------------------
pii_redaction:
  stage: "pre-export"
  always_on: true
  non_delegatable: true
  llm_can_bypass: false
  control_id: "C-MT-08"

  deterministic_filters:
    - filter_id: "DRF-01"
      name: "Regex PII Filter"
      type: "regex"
      patterns:
        - name: "API Keys"
          regex: "(?i)(api[_-]?key)\\s*[=:]\\s*\\S{20,}"
          replacement: "[REDACTED]"
        - name: "Bearer Tokens"
          regex: "(?i)bearer\\s+\\S{20,}"
          replacement: "[REDACTED]"
        - name: "Generic Secrets"
          regex: "(?i)(secret|password|token)\\s*[=:]\\s*\\S{20,}"
          replacement: "[REDACTED]"
          exclusions:
            - "G8_MULTITENANT_APPROVED_v1"
            - "G7_IMPROVEMENT_BOUNDS_v1"
            - "RESUME_TOKEN"
        - name: "Credit Card Numbers"
          regex: "\\b\\d{13,19}\\b"
          replacement: "[REDACTED_CC]"
        - name: "SSN"
          regex: "\\b\\d{3}-\\d{2}-\\d{4}\\b"
          replacement: "[REDACTED_SSN]"
        - name: "Email Addresses"
          regex: "\\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Z|a-z]{2,}\\b"
          replacement: "[REDACTED_EMAIL]"
        - name: "Phone Numbers"
          regex: "\\b\\+?\\d{1,3}?[-.\\s]?\\(?\\d{1,4}?\\)?[-.\\s]?\\d{1,4}[-.\\s]?\\d{1,9}\\b"
          replacement: "[REDACTED_PHONE]"
      latency_budget_us: 500
      coverage: "high precision, medium recall"

    - filter_id: "DRF-02"
      name: "NER PII Filter"
      type: "ner_model"
      model: "spacy_en_core_web_sm or Presidio NER engine"
      entities:
        - "PERSON"
        - "ORG"
        - "GPE"
        - "DATE"
        - "MONEY"
        - "ADDRESS"
      replacement: "[REDACTED_NER]"
      latency_budget_ms: 5
      coverage: "medium precision, high recall"
      per_tenant_config: true
      notes: "Per-tenant configurable recognizers for domain-specific PII"

    - filter_id: "DRF-03"
      name: "Secret Scanner"
      type: "entropy + pattern"
      patterns:
        - "High-entropy strings (>4.5 bits/char)"
        - "Known secret formats (AWS, GCP, Azure, GitHub)"
        - "Private keys (BEGIN RSA PRIVATE KEY, etc.)"
      replacement: "[REDACTED_SECRET]"
      min_length: 20
      exclusions:
        - "G8_MULTITENANT_APPROVED_v1"
        - "G7_IMPROVEMENT_BOUNDS_v1"
        - "G5_EVAL_FRAMEWORK_APPROVED_v1"
        - "G6_VIBE_ENV_LOCKED_v1"
        - "G4_TOPOLOGY_APPROVED_v1"
        - "G3_CONTEXT_LAYER_LOCKED_v1"
        - "G2_TOOL_REGISTRY_LOCKED_v1"
        - "G1_HARNESS_APPROVED_v1"
        - "RESUME_TOKEN"
      notes: "Exclude known resume token strings from secret scan false positives"

  llm_advisory:
    enabled: true
    type: "advisory_only"
    can_bypass_deterministic: false
    can_downgrade_deny: false
    on_flag_pii: "escalate to hitl"
    on_flag_safe: "no action (allow export)"
    description: "LLM evaluates for implicit/contextual PII not caught by deterministic filters"
    notes: "OWASP LLM06: LLM advisory can only escalate (allow to hitl) or confirm (deny to deny). Never downgrade."

# ---------------------------------------------------------------------------
# 3. Per-Tenant Pipeline Configuration
# ---------------------------------------------------------------------------
per_tenant_pipelines:
  RT-1:
    redaction_filters: [DRF-01, DRF-03]
    llm_advisory: false
    export_backend: "otlp://localhost:4317"
    retention_days: 30
    notes: "Standard redaction; no LLM advisory for RT-1"

  RT-2:
    redaction_filters: [DRF-01, DRF-02, DRF-03]
    llm_advisory: true
    export_backend: "otlp://localhost:4317"
    retention_days: 60
    notes: "Enhanced redaction with NER + LLM advisory"

  RT-3:
    redaction_filters: [DRF-01, DRF-02, DRF-03]
    llm_advisory: true
    export_backend: "otlp://tenant-specific-backend:4317"
    retention_days: 90
    audit_required: true
    notes: "Mandatory PII redaction + audit; per-tenant export backend"

  RT-4:
    redaction_filters: [DRF-01, DRF-02, DRF-03]
    llm_advisory: true
    human_review: true
    export_backend: "otlp://tenant-specific-backend:4317"
    retention_days: 365
    audit_required: true
    legal_hold: true
    notes: "Full PII redaction + human review + legal hold; 1 year retention"

# ---------------------------------------------------------------------------
# 4. OTEL Span Enrichment (Per-Tenant)
# ---------------------------------------------------------------------------
span_enrichment:
  required_attributes:
    - key: "tenant_id"
      description: "Tenant identifier"
      immutable: true
      validation: "must match envelope.tenant_id"
    - key: "agent_id"
      description: "Agent identifier"
      immutable: true
    - key: "isolation_tier"
      description: "ISO-1, ISO-2, or ISO-3"
      immutable: true
    - key: "risk_tier"
      description: "RT-1 through RT-4"
      immutable: true
    - key: "policy_decision"
      description: "allow, deny, hitl, rewrite_caps"
      immutable: true
    - key: "rule_ids"
      description: "Policy rules that fired"
      immutable: true
    - key: "envelope_id"
      description: "Authorization envelope ULID"
      immutable: true

  inherited_from_g5:
    - key: "trace_id"
      description: "W3C traceparent"
      source: "G5 OBSERVABILITY_PILLARS_SPEC.yaml"
    - key: "span_id"
      description: "W3C span_id"
      source: "G5 OBSERVABILITY_PILLARS_SPEC.yaml"
    - key: "session_id"
      description: "Hermes session ID"
      source: "G5 OBSERVABILITY_PILLARS_SPEC.yaml"
    - key: "trust_score"
      description: "Per-tenant trust score at time of span"
      source: "G5 CIRCUIT_BREAKER_RULES.yaml"
    - key: "circuit_breaker_state"
      description: "Per-tenant circuit breaker state"
      source: "G5 CIRCUIT_BREAKER_RULES.yaml"

  span_types:
    - type: "root"
      description: "Root agent span (per tenant session)"
      tenant_scoped: true
    - type: "agent"
      description: "Agent execution span"
      tenant_scoped: true
    - type: "tool"
      description: "Tool call span (MCP, shell, fs, a2a)"
      tenant_scoped: true
      envelope_required: true
    - type: "delegate"
      description: "A2A delegation span"
      tenant_scoped: true
      card_id_required: true
    - type: "eval"
      description: "Evaluation span (G5)"
      tenant_scoped: true
    - type: "policy"
      description: "Policy server decision span"
      tenant_scoped: true
      envelope_id_required: true

# ---------------------------------------------------------------------------
# 5. Cross-Tenant Telemetry Isolation
# ---------------------------------------------------------------------------
cross_tenant_isolation:
  - guarantee_id: "CTI-01"
    description: "No cross-tenant trace context propagation"
    enforcement: "Per-tenant trace context; W3C traceparent scoped to tenant"
    control_id: "C-MT-01"
  - guarantee_id: "CTI-02"
    description: "No cross-tenant log correlation"
    enforcement: "tenant_id filter on all log queries"
    control_id: "C-MT-01"
  - guarantee_id: "CTI-03"
    description: "No cross-tenant metric aggregation"
    enforcement: "Per-tenant metric labels; no cross-tenant aggregation"
    control_id: "C-MT-01"
  - guarantee_id: "CTI-04"
    description: "PII redaction before export (all tenants, all tiers)"
    enforcement: "Deterministic redaction filter pre-export"
    control_id: "C-MT-08"
  - guarantee_id: "CTI-05"
    description: "Per-tenant circuit breaker state in spans"
    enforcement: "trust_score and circuit_breaker_state are per-tenant attributes"
    control_id: "C-MT-03"

# ---------------------------------------------------------------------------
# 6. G5 Inheritance (Per-Tenant Scoping)
# ---------------------------------------------------------------------------
g5_inheritance:
  trajectory_schema:
    inherited: true
    per_tenant: true
    fields: ["Mission", "Scene", "Thought", "Action", "Observation", "Verdict"]
    notes: "Each tenant's trajectories are isolated; no cross-tenant trajectory visibility"

  trust_score:
    inherited: true
    per_tenant: true
    range: [0.0, 1.0]
    initial: 1.0
    notes: "Per-tenant trust scores; no cross-tenant trust contamination"

  circuit_breaker:
    inherited: true
    per_tenant: true
    fm_triggers: "all 15 from G4 FAILURE_MODE_MATRIX"
    trip_threshold_per_tier:
      RT-1: 0.50
      RT-2: 0.50
      RT-3: 0.70
      RT-4: 0.80
    notes: "Trip in one tenant does not affect others"

  agbom:
    inherited: true
    per_tenant: true
    notes: "Per-tenant AgBOM; cross-tenant tool access detected as drift"

  llm_as_judge:
    inherited: true
    per_tenant: true
    notes: "Judge model shared but results isolated per tenant"

  red_blue_green:
    inherited: true
    per_tenant: true
    notes: "Per-tenant teams; cross-tenant red team only with HITL"

# ---------------------------------------------------------------------------
# 7. Dashboard Panels (Per-Tenant)
# ---------------------------------------------------------------------------
dashboard_panels:
  - panel_id: "PANEL-MT-01"
    name: "Tenant Isolation Status"
    description: "Cross-tenant isolation verification dashboard"
    metrics:
      - "cross_tenant_breach_count (must be 0)"
      - "tenant_isolation_violations"
      - "svid_validation_failures"
    per_tenant: true

  - panel_id: "PANEL-MT-02"
    name: "Policy Server Decisions"
    description: "Per-tenant policy decision distribution"
    metrics:
      - "policy_decisions_total{tenant_id, decision}"
      - "policy_decisions_latency{tenant_id}"
      - "policy_false_positive_rate{tenant_id}"
    per_tenant: true

  - panel_id: "PANEL-MT-03"
    name: "PII Redaction Coverage"
    description: "PII redaction filter coverage and false negatives"
    metrics:
      - "pii_redacted_total{tenant_id, filter_id}"
      - "pii_false_negative_count{tenant_id}"
      - "pii_advisory_escalations{tenant_id}"
    per_tenant: true
    pass_criterion: "100% of egress calls scanned"

  - panel_id: "PANEL-MT-04"
    name: "Per-Tenant Trust Scores"
    description: "Trust score per tenant over time"
    metrics:
      - "trust_score{tenant_id}"
      - "circuit_breaker_trips{tenant_id}"
      - "circuit_breaker_state{tenant_id}"
    per_tenant: true

  - panel_id: "PANEL-MT-05"
    name: "Per-Tenant Budget Consumption"
    description: "Token/cost budget consumption per tenant"
    metrics:
      - "tokens_used{tenant_id}"
      - "cost_usd{tenant_id}"
      - "budget_remaining{tenant_id}"
    per_tenant: true

  - panel_id: "PANEL-MT-06"
    name: "Per-Tenant Improvement Loop"
    description: "Improvement proposals and outcomes per tenant"
    metrics:
      - "improvement_proposals{tenant_id, severity}"
      - "improvement_integrations{tenant_id, severity}"
      - "improvement_rollbacks{tenant_id}"
      - "loop_budget_used{tenant_id}"
    per_tenant: true

# ---------------------------------------------------------------------------
# 8. Audit Log Configuration
# ---------------------------------------------------------------------------
audit_log:
  format: "structured_json"
  per_tenant: true
  retention_per_tier:
    RT-1: 30
    RT-2: 60
    RT-3: 90
    RT-4: 365

  required_fields:
    - "timestamp"
    - "tenant_id"
    - "agent_id"
    - "envelope_id"
    - "policy_decision"
    - "rule_ids"
    - "reason_code"
    - "trace_id"
    - "span_id"

  never_logged:
    - "raw_svid"
    - "api_keys"
    - "bearer_tokens"
    - "pan_data"
    - "openrouter_keys"
    - "raw_mandate_private_keys"
    - "oauth_refresh_tokens"

  cross_tenant_access: "denied"
  legal_hold_support: true
  legal_hold_tiers: [RT-4]
