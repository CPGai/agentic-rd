# G8 — Sandbox Runtime & Policy Inventory (Step B)
# Model Tier: Fast Flash
# Status: DRAFT_PRE_GATE
# Upstream: self-improvement-v1.0.0 (G7 LOCKED)
# BLUE resume: G8_MULTITENANT_APPROVED_v1

version: "1.0.0-draft"
domain: G8
kind: sandbox_runtime_inventory
status: DRAFT_PRE_GATE
overlay: OPTION_2_STANDARD
upstream_tag: self-improvement-v1.0.0
blue_resume_token: G8_MULTITENANT_APPROVED_v1

# ---------------------------------------------------------------------------
# 1. Sandbox Runtime Inventory
# ---------------------------------------------------------------------------
sandbox_runtimes:
  docker:
    status: available
    version: "29.6.1"
    kernel: "6.6.87.2-microsoft-standard-WSL2"
    arch: x86_64
    server: Docker Desktop
    features:
      - "Docker bridge networking"
      - "Volume mounts"
      - "Container isolation"
      - "docker-compose (Honcho stack uses it)"
    g8_tier: T2
    notes: "Primary process isolation mechanism. Honcho stack already runs in Docker containers."

  wsl2_namespaces:
    status: available
    kernel: "6.6.87.2-microsoft-standard-WSL2"
    namespaces_available:
      - net
      - ipc
      - mnt
      - pid
      - user
      - uts
      - cgroup
      - time
    cgroups: "v2 available"
    g8_tier: T1
    notes: "WSL2 provides namespace isolation for logical tenant separation."

  gvisor:
    status: not_found
    binary: runsc
    g8_tier: T3
    notes: "Not installed. Would provide sandboxed kernel for regulated tenants. Declared but not wired — HITL per tenant."

  firecracker:
    status: not_found
    binary: firecracker
    g8_tier: T3
    notes: "Not installed. Would provide microVM isolation. Declared but not wired — HITL per tenant."

  runc:
    status: not_found
    binary: runc
    g8_tier: T2
    notes: "Not installed. Docker uses its bundled containerd/runc. Not needed separately."

  containerd:
    status: not_found
    binary: containerd
    g8_tier: T2
    notes: "Not installed directly. Docker Desktop bundles its own containerd."

# ---------------------------------------------------------------------------
# 2. Existing Infrastructure Inventory (for tenant isolation analysis)
# ---------------------------------------------------------------------------
existing_infrastructure:
  honcho_stack:
    containers:
      - name: honcho-api-1
        image: honcho-api
        ports: "8000 -> 8000"
        status: healthy
        purpose: "REST API for memory provider"
      - name: honcho-deriver-1
        image: honcho-deriver
        ports: none
        status: running
        purpose: "Deriver LLM loop"
      - name: honcho-redis-1
        image: redis:8.2
        ports: "6379 -> 6379"
        status: healthy
        purpose: "Cache and message broker"
      - name: honcho-database-1
        image: pgvector/pgvector:pg15
        ports: "5432 -> 5432"
        status: healthy
        purpose: "PostgreSQL with pgvector"
      - name: hermes-api-bridge
        image: alpine/socat
        ports: "8642 -> 8642"
        status: running
        purpose: "Socat bridge for IPC"
    g8_notes:
      - "Honcho uses AUTH_USE_AUTH=false — MED risk for multi-tenant"
      - "All containers share the same Docker network"
      - "No per-tenant isolation currently"

  cron_jobs:
    count: 3
    status: active
    g8_notes: "Cron jobs run in the same Hermes session context. Per-tenant cron isolation not implemented."

  profile:
    active: wsl-runtime
    skills_count: 93
    platforms: [pairing]
    memory_provider: honcho
    g8_notes: "Single profile. Multi-tenant would need profile-scoped isolation."

# ---------------------------------------------------------------------------
# 3. Available Isolation Mechanisms
# ---------------------------------------------------------------------------
isolation_mechanisms:
  - mechanism: "WSL2 namespace isolation"
    available: true
    g8_tier: T1
    description: "Linux namespaces (user, net, mnt, pid, uts, ipc, cgroup, time) provide logical separation"
    configuration_effort: low
    notes: "WSL2 distributions are already namespaced from each other and from Windows host"

  - mechanism: "Docker container isolation"
    available: true
    g8_tier: T2
    description: "Full container runtime with bridge networking, volume mounts, resource limits"
    configuration_effort: medium
    notes: "Already proven by Honcho stack. Docker Desktop handles container lifecycle."

  - mechanism: "Filesystem sandbox"
    available: true
    g8_tier: T1
    description: "Hermes filesystem sandbox (C-FS-01, C-FS-02) provides path-level isolation"
    configuration_effort: low
    notes: "Already declared in G1 constraint catalog. Used by WSL2 routing."

  - mechanism: "gVisor sandbox"
    available: false
    g8_tier: T3
    description: "User-space kernel providing additional security layer inside container"
    installation_command: "sudo apt install runsc"
    configuration_effort: medium
    notes: "Declared but not wired. Requires HITL per tenant to enable."

  - mechanism: "Firecracker microVM"
    available: false
    g8_tier: T3
    description: "MicroVM for lightweight hardware-level isolation"
    installation_command: "Manual download from GitHub releases"
    configuration_effort: high
    notes: "Declared but not wired. Requires HITL per tenant. G10 concern for production scale."

# ---------------------------------------------------------------------------
# 4. Procurement Summary
# ---------------------------------------------------------------------------
procurement_summary:
  t1_logical_isolation:
    status: "Available — WSL2 namespaces + filesystem sandbox"
    gap: "No per-tenant policy engine"
    g8_relevance: "Default for standard development tenants"

  t2_process_isolation:
    status: "Available — Docker containers"
    gap: "No tenant-aware Docker orchestration; containers are system-wide"
    g8_relevance: "Default for medium-sensitivity tenants"

  t3_microvm_isolation:
    status: "Not available — gVisor and Firecracker not installed"
    gap: "Requires installation + HITL per tenant"
    g8_relevance: "Regulated tenants; PII processing"

  t4_hardware_isolation:
    status: "Not available — forbidden under OPTION_2"
    gap: "G10 concern"
    g8_relevance: "Highest sensitivity"

# ---------------------------------------------------------------------------
# 5. Policy Server Components
# ---------------------------------------------------------------------------
policy_server_components:
  static_policy_engine:
    status: "Declared not wired (G4 POLICY_INTERCEPT_SPEC.yaml)"
    format: "YAML rules"
    decision_types: [allow, deny, hitl, rewrite_caps]
    g8_relevance: "Core of G8 architecture — all tool calls route through this"

  dynamic_context_resolver:
    status: "Schema declared in this spec"
    fields: [tenant_id, risk_tier, pii_classification, session_context]
    g8_relevance: "Resolves tenant identity and context for policy evaluation"

  authorization_envelope:
    status: "Schema defined in this spec (§3)"
    sections: [tenant_id, identity, request, context, policy, audit]
    g8_relevance: "Universal audit record for every tool call decision"

  owasp_llm06_controls:
    status: "8 controls declared in this spec (§4)"
    g8_relevance: "Non-delegable to LLM — enforced by deterministic engine"

# ---------------------------------------------------------------------------
# 6. Per-Tenant Capability Gaps
# ---------------------------------------------------------------------------
capability_gaps:
  - gap: "Per-tenant trust score"
    severity: HIGH
    description: "G5 trust score is per-session; G8 needs per-tenant"
    solution: "Extend trust score with tenant_id dimension"

  - gap: "Per-tenant circuit breaker"
    severity: HIGH
    description: "G5 circuit breaker is system-wide; trip in one tenant affects all"
    solution: "Scope circuit breaker state to (tenant_id, session_id)"

  - gap: "Per-tenant AgBOM"
    severity: MED
    description: "G5 AgBOM is per-session; cross-tenant tool access not detected"
    solution: "Add tenant_id to AgBOM; detect cross-tenant tool access as drift"

  - gap: "Per-tenant improvement loop budget"
    severity: MED
    description: "G7 loop budget is per-session; one tenant's loop can starve another"
    solution: "Scope loop budget to (tenant_id, session_id)"

  - gap: "Per-tenant skill isolation"
    severity: HIGH
    description: "G7 generated skills go to shared profile directory"
    solution: "Tenant-scoped skill directories; cross-tenant skill sharing requires HITL"

  - gap: "Honcho AUTH_USE_AUTH"
    severity: MED
    description: "Honcho runs without authentication — any tenant can read/write any memory"
    solution: "Enable Honcho auth; configure per-tenant API keys or JWT"