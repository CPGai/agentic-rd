# tenant_policies.yaml
# G8 — Declarative Policy Enforcement Rules (Per-Tenant)
# Status: DRAFT_PRE_GATE
# Overlay: OPTION_2_STANDARD
# Upstream: self-improvement-v1.0.0 (G7 LOCKED)
# BLUE resume: G8_MULTITENANT_APPROVED_v1
# Tier: Strong Coding (Step D)
#
# This file defines the compiled policy rules for each tenant.
# The Hybrid Policy Server loads these at tenant registration time.
# Rules are evaluated deterministically; the LLM never interprets policy.
# Fail-closed: if no rule matches, the default decision is deny.

version: "1.0.0-draft"
domain: G8
kind: tenant_policies
status: DRAFT_PRE_GATE
overlay: OPTION_2_STANDARD
upstream_tag: self-improvement-v1.0.0
blue_resume_token: G8_MULTITENANT_APPROVED_v1

# ---------------------------------------------------------------------------
# Global System-Wide Rules (apply to ALL tenants; no tenant can relax)
# These encode G7 Hard Bounds (HB-01 to HB-10) as policy rules.
# ---------------------------------------------------------------------------
system_wide_rules:
  - id: SYS-01
    description: "HB-01: L4 AgentCreator is disabled"
    condition: "improvement.type == L4_enablement"
    decision: deny
    reason_code: "L4_DISABLED_SYSTEM_WIDE"
    source: "G7 HB-01"

  - id: SYS-02
    description: "HB-02: No constraint catalog self-modification"
    condition: "cap == constraint.modify"
    decision: deny
    reason_code: "CONSTRAINT_SELF_MOD_FORBIDDEN"
    source: "G7 HB-02"

  - id: SYS-03
    description: "HB-03: No circuit breaker bypass"
    condition: "cap == circuit_breaker.reset"
    decision: hitl
    reason_code: "CIRCUIT_BREAKER_RESET_REQUIRES_HITL"
    source: "G7 HB-03"

  - id: SYS-04
    description: "HB-05: No secret/credential generation"
    condition: "cap == secret.gen"
    decision: deny
    reason_code: "SECRET_GENERATION_FORBIDDEN"
    source: "G7 HB-05"

  - id: SYS-05
    description: "HB-06: No cross-profile writes"
    condition: "cap == fs.write, path.startswith(/profiles/)"
    decision: deny
    reason_code: "CROSS_PROFILE_WRITE_FORBIDDEN"
    source: "G7 HB-06"

  - id: SYS-06
    description: "HB-07: No host-Windows Python execution"
    condition: "cap == shell.exec, interpreter == host_python"
    decision: deny
    reason_code: "WSL2_MANDATE_VIOLATION"
    source: "G7 HB-07"

  - id: SYS-07
    description: "HB-09: No G6 transition trigger relaxation"
    condition: "cap == transition_trigger.disable"
    decision: deny
    reason_code: "TRIGGER_RELAXATION_FORBIDDEN"
    source: "G7 HB-09"

  - id: SYS-08
    description: "C-MT-02: Policy server is non-delegatable"
    condition: "always"
    decision: "evaluate_policy_server"
    reason_code: "POLICY_SERVER_NON_DELEGATABLE"
    source: "G8 C-MT-02"

  - id: SYS-09
    description: "C-MT-06: SPIFFE SVID required for all tool calls"
    condition: "svid == null"
    decision: deny
    reason_code: "SVID_REQUIRED"
    source: "G8 C-MT-06"

  - id: SYS-10
    description: "C-MT-07: Authorization envelope required"
    condition: "envelope == null"
    decision: deny
    reason_code: "ENVELOPE_REQUIRED"
    source: "G8 C-MT-07"

# ---------------------------------------------------------------------------
# Tenant: t-internal-dev (RT-1, ISO-1)
# ---------------------------------------------------------------------------
tenants:
  - tenant_id: "t-internal-dev"
    risk_tier: RT-1
    isolation_tier: ISO-1
    description: "Internal development team — low-risk PII"
    registered_by: "human_systems_architect"
    registration_date: "2026-07-24"

    capabilities_allowed:
      - fs.read:tenant_scope
      - fs.write:tenant_scope
      - net.egress:policy_proxied
      - shell.exec:wsl2_routed
      - mcp.call:T1_T2_allowlist
      - a2a.delegate:card_option2
      - memory.read:tenant_scope
      - memory.write:tenant_scope
      - skill.gen:tenant_scope
      - budget.spend:tenant_ceiling

    structural_rules:
      - id: R-ID-S01
        condition: "tool.risk_tier in [T1, T2]"
        decision: allow
      - id: R-ID-S02
        condition: "tool.risk_tier == T3"
        decision: hitl
        reason_code: "T3_REQUIRES_HITL"
      - id: R-ID-S03
        condition: "tool.risk_tier == T4"
        decision: deny
        reason_code: "T4_FORBIDDEN_RT1"
      - id: R-ID-S04
        condition: "cap == fs.write, path.startswith(specs/tenants/t-internal-dev/)"
        decision: allow
      - id: R-ID-S05
        condition: "cap == fs.write, path.startswith(AGENTS.md)"
        decision: deny
        reason_code: "SHARED_SPEC_IMMUTABLE"
      - id: R-ID-S06
        condition: "cap == fs.write, path.startswith(HARNESS_SPEC.md)"
        decision: deny
        reason_code: "SHARED_SPEC_IMMUTABLE"
      - id: R-ID-S07
        condition: "cap == mcp.call, mcp.server in [context7]"
        decision: allow
      - id: R-ID-S08
        condition: "cap == mcp.call, mcp.server not_in [context7]"
        decision: deny
        reason_code: "MCP_SERVER_NOT_ALLOWLISTED"

    semantic_rules:
      - id: R-ID-SEM01
        condition: "contains_pii(output) == true"
        decision: deny
        reason_code: "PII_DETECTED"
        filter: "regex"
      - id: R-ID-SEM02
        condition: "contains_secret(output) == true"
        decision: deny
        reason_code: "SECRET_DETECTED"

    budget_rules:
      - id: R-ID-B01
        condition: "session.tokens_used > 500000"
        decision: hitl
        reason_code: "TOKEN_CEILING_APPROACHED"
      - id: R-ID-B02
        condition: "session.cost_usd > 10.00"
        decision: deny
        reason_code: "COST_CEILING_EXCEEDED"
      - id: R-ID-B03
        condition: "loop.proposals_this_session > 10"
        decision: hitl
        reason_code: "LOOP_BUDGET_EXCEEDED"

    improvement_rules:
      - id: R-ID-I01
        condition: "improvement.severity == S1"
        decision: deny
        reason_code: "S1_FREEZE"
      - id: R-ID-I02
        condition: "improvement.severity == S2"
        decision: hitl
        reason_code: "S2_REQUIRES_HITL"
      - id: R-ID-I03
        condition: "improvement.severity in [S3, S4], improvement.scope == token_level"
        decision: allow
      - id: R-ID-I04
        condition: "improvement.severity in [S3, S4], improvement.scope == behavioral"
        decision: hitl
        reason_code: "BEHAVIORAL_CHANGE_REQUIRES_HITL"

    circuit_breaker:
      trip_threshold: 0.50
      warning_threshold: 0.70
      fm_triggers: "all 15 from G4 FAILURE_MODE_MATRIX"
      per_tenant_isolated: true

