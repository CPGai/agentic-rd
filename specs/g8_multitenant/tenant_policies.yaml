# ---------------------------------------------------------------------------
# Default Policy (fail-closed)
# ---------------------------------------------------------------------------
default_policy:
  unmatched_decision: deny
  reason_code: "NO_RULE_MATCHED_FAIL_CLOSED"
  description: "If no rule matches, deny the request. No implicit allow."

# ---------------------------------------------------------------------------
# Cross-Tenant Isolation Guarantees
# ---------------------------------------------------------------------------
cross_tenant_guarantees:
  - guarantee_id: CTG-01
    description: "No tenant can read another tenant's filesystem"
    enforcement: "mount namespace + path prefix check"
    control_id: "C-MT-01"
  - guarantee_id: CTG-02
    description: "No tenant can assume another tenant's identity"
    enforcement: "SPIFFE SVID tenant_id validation"
    control_id: "C-MT-06"
  - guarantee_id: CTG-03
    description: "No tenant's circuit breaker trip affects another tenant"
    enforcement: "per-tenant circuit breaker state"
    control_id: "C-MT-03"
  - guarantee_id: CTG-04
    description: "No tenant's trust score affects another tenant"
    enforcement: "per-tenant trust score"
    control_id: "C-MT-04"
  - guarantee_id: CTG-05
    description: "No tenant's improvement loop budget is shared"
    enforcement: "per-tenant loop budget counter"
    control_id: "C-MT-05"
  - guarantee_id: CTG-06
    description: "No tenant can modify shared specs (AGENTS.md, HARNESS_SPEC.md)"
    enforcement: "path-based deny rules for all tenants"
    source: "G7 HB-06"
