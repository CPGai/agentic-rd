  default_agent_level: L2
  l4_enabled: false
  model_routing: dynamic  # premium_frontier | strong_coding | fast_flash

# ---------------------------------------------------------------------------
# Core equations
# ---------------------------------------------------------------------------
equations:
  agent: "model + harness"
  harness_union: ["context_harness", "constraint_harness", "evaluation_harness"]
  loop: ["read", "write", "test", "observe", "fix"]
  wp_f1_loop: ["get_mission", "scan_scene", "think", "act", "observe_iterate"]

# ---------------------------------------------------------------------------
# Taxonomy (WP-F1) with factory binding (WP-S1)
# ---------------------------------------------------------------------------
taxonomy:
  levels:
    L0:
      name: core_reasoning_system
      agentic: false
      tools: false
      memory: false
      multi_agent: false
      self_evolve: false
      min_harnesses: []
      developer_mode: null
      topology: single_shot
    L1:
      name: connected_problem_solver
      agentic: true
      tools: true
      memory: false
      multi_agent: false
      self_evolve: false
      min_harnesses: [context_harness, constraint_harness, evaluation_harness]
      developer_mode: conductor
      topology: single_agent_tools
    L2:
      name: strategic_problem_solver
      agentic: true
      tools: true
      memory: true
      context_engineering: true
      multi_agent: false
      self_evolve: false
      min_harnesses: [context_harness, constraint_harness, evaluation_harness]
      developer_mode: conductor_to_light_orchestrator
      topology: single_agent_sequential_multitool
      default_for_workspace: true
    L3:
      name: collaborative_multi_agent_system
      agentic: true
      tools: true
      memory: true
      multi_agent: true
      a2a: true
      self_evolve: false
      min_harnesses: [context_harness, constraint_harness, evaluation_harness]
      developer_mode: orchestrator
      topology: hierarchical_coordinator_specialists
      requires_gate: G4_TOPOLOGY_APPROVED_v1
    L4:
      name: self_evolving_system
      agentic: true
      tools: true
      memory: true
      multi_agent: true
      self_evolve: true
      min_harnesses: [context_harness, constraint_harness, evaluation_harness, meta_evaluation]
      developer_mode: orchestrator
      topology: dynamic_with_agent_creator
      requires_gate: G7_IMPROVEMENT_BOUNDS_v1  # placeholder until G7 pack locks exact token
      enabled: false

# ---------------------------------------------------------------------------
# Harness nodes
# ---------------------------------------------------------------------------
harnesses:
  context_harness:
    id: H_CONTEXT
    kind: harness
    wp_s1_refs: ["pp.15-18 six context types", "pp.16-17 static vs dynamic", "pp.17-18 skills progressive disclosure"]
    context_types:
      instructions:
        placement: static
        artifacts: [AGENTS.md, "module GEMINI.md|CLAUDE.md"]
        token_share_target: "5-10%"
      knowledge:
        placement: progressive_dynamic
        artifacts: [specs/, docs/, specs/references/]
        token_share_target: on_demand
      memory:
        placement: hybrid
        artifacts: [session_store, honcho_profile, SESSION_STATE_SPEC]
        token_share_target: "2-5% pinned + windowed dynamic"
      examples:
        placement: dynamic_on_skill_match
        artifacts: [examples/, eval_goldens, skill_embedded]
        token_share_target: on_demand
      tools:
        placement: progressive_dynamic
        artifacts: [TOOL_REGISTRY.md, mcp_schemas]
        token_share_target: on_demand
        policy: rag_for_tools
      guardrails:
        placement: static_core_plus_dynamic_specialized
        artifacts: [HARNESS_SPEC.md#constraint-catalog, hooks, policy_snippets]
        token_share_target: "3-5% core"
    static_budget_hard_cap_pct: 20
    assembly_pipeline:
      - load_static_pack
      - skill_l1_match
      - skill_l2_l3_load
      - tool_schema_intent_match
      - knowledge_retrieve
      - memory_window_attach
      - model_invoke
      - capture_action_observation
      - compact_if_threshold
      - verdict_or_loop
    owns_downstream: [G3]
    edge_semantics_default: deterministic_load

  constraint_harness:
    id: H_CONSTRAINT
    kind: harness
    wp_s1_refs: ["pp.28 hooks/guardrails", "pp.29-30 SDLC harness phases", "p.41 security remediation"]
    enforcement_layers:
      L0_hooks: deterministic
      L1_structural_tests: deterministic
      L2_linters_auditors: deterministic
      L3_llm_auditor: strong_coding
      L4_human_gate: hitl
    catalog_ref: HARNESS_SPEC.md#31-constraint-catalog
    catalog_ids:
      - C-FS-01
      - C-FS-02
      - C-LIB-01
      - C-LIB-02
      - C-ARCH-01
      - C-ARCH-02
      - C-ARCH-03
      - C-ARCH-04
      - C-CODE-01
      - C-CODE-02
      - C-CODE-03
      - C-SEC-01
      - C-SEC-02
      - C-SEC-03
      - C-LOOP-01
      - C-LOOP-02
      - C-MODEL-01
      - C-HITL-01
    sandbox:
      required: true
      substrate: wsl2
      append_windows_path: false
    owns_downstream: [G2, G6, G8, G10]
    edge_semantics_default: deterministic_enforce

  evaluation_harness:
    id: H_EVAL
    kind: harness
    wp_s1_refs: ["pp.14-15 tests vs evals", "p.23 quality flywheel", "p.30 feedback loop", "p.44 eval bar"]
    correctness_classes:
      - syntactic
      - structural
      - functional
      - trajectory
      - semantic_quality
      - security_trust
    loop_integration:
      on_pass: complete_or_next_mission
      on_fail: fix_if_budget_else_escalate
      on_escalate: hitl_tool
    g1_minimum_suite:
      - constitution_integrity
      - constraint_catalog_coverage
      - workflow_graph_validation
      - taxonomy_conformance
      - no_secret_scan
    full_suite_owner: G5
    owns_downstream: [G5, G7, G9, G10]
    edge_semantics_default: mixed  # deterministic tests + probabilistic judges

