  # Human configures factory
  - { id: E001, from: HUMAN, to: H_CONTEXT, kind: hitl, label: configure_instructions_and_specs }
  - { id: E002, from: HUMAN, to: H_CONSTRAINT, kind: hitl, label: approve_blocker_catalog }
  - { id: E003, from: HUMAN, to: H_EVAL, kind: hitl, label: approve_rubrics_and_thresholds }

  # Context → models
  - { id: E010, from: H_CONTEXT, to: M_PREMIUM, kind: dynamic, label: route_if_architecture_or_synthesis }
  - { id: E011, from: H_CONTEXT, to: M_STRONG, kind: dynamic, label: route_if_scaffold_or_spec_emit }
  - { id: E012, from: H_CONTEXT, to: M_FLASH, kind: dynamic, label: route_if_validate_or_mechanical }

