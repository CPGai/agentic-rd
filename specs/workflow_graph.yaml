  effect: unlock_G2_through_G10_under_option_2_overlays
precedence:
  whitepapers: "WP-S* supersedes WP-F* on overlap"
  runtime_constitution: AGENTS.md
  deep_spec: HARNESS_SPEC.md

metadata:
  workspace_root: /home/carlospg/workspace/agentic-rd
  substrate: wsl2-ubuntu-24.04
